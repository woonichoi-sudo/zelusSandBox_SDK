<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cobalt — 3D view</title>
    <style>
      /*
        ── 팔레트 (T-1) ────────────────────────────────────────────
        데스크톱 `zelusSandBox` 의 색을 옮긴 것이다. 예전 값은 **푸른기가 도는
        회색**(#1b1e24 계열)이었는데, 데스크톱은 중성 회색에 파랑을 강조로만
        쓴다. 나란히 놓으면 같은 프로그램으로 안 보이던 이유의 대부분이 이
        색조 차이였다.

        ★ **여기 말고 다른 데에 색을 적지 않는다.** 예전에는 같은 회색이 스무
          곳에 리터럴로 흩어져 있어서, 한 곳을 고치면 나머지가 조용히 갈라졌다.
          아래 규칙들은 전부 이 이름들만 쓴다.

        ⚠️ `--accent` 는 **채도가 높다.** `src/verify/ui.ts` 가 화면 전체
           스크린샷에서 색조 분포를 세어 옷이 제대로 그려졌는지 판정하는데,
           파랑(약 220°)이 넓은 면적을 먹으면 그 판정을 흐린다. 강조는 선·밑줄·
           손잡이처럼 **가는 것**에만 쓸 것 — 큰 면을 칠하지 말 것.
      */
      :root {
        color-scheme: dark;

        /* 바탕 — 뒤로 갈수록 어둡다 */
        --bg: #1e1f22;          /* 창 바탕 */
        --chrome: #2b2d30;      /* 메뉴바 · 상태 바 */
        --panel: #2e3033;       /* 오른쪽 칸 · 툴바 */
        --panel-hi: #383b3f;    /* 떠 있는 상자 (메뉴 · 로그) */

        /* 조작 요소 */
        --ctl: #3a3d41;         /* 버튼 · 입력 */
        --ctl-hi: #45484d;      /* 그 위에 마우스 */
        --hover: #35383c;       /* 테두리 없는 것에 마우스 */

        /* 선 */
        --line: #4d5157;        /* 조작 요소의 테두리 */
        --line-soft: #3a3d41;   /* 칸을 가르는 선 */

        /* 글자 */
        --text: #dfe1e5;

        /* 강조 — 위 ⚠️ 참고 */
        --accent: #3574f0;
        --accent-hi: #548af7;
        --accent-dim: #2c3a52;  /* 강조를 면으로 써야 할 때 (고른 카드 등) */

        /* 사유의 색. 빨강은 고장, 주황은 "되긴 하는데 조건이 있다" */
        --err: #ff8a8a;
        --err-line: #6b3a3f;
        --warn: #f0c274;
        --warn-line: #6b5730;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); }
      /*
        ⚠️ **`body` 의 `overflow: hidden` 만으로는 부족하다.** 아래 서랍이
        닫혀 있을 때 `translateX(101%)` 로 화면 밖에 서 있는데, 그것이
        문서를 넓혀서 **가로로 실제 스크롤이 됐다**(실측: 800px 창에서
        `scrollWidth` 1188, `scrollLeft` 를 388 까지 밀 수 있었다). 스크롤바가
        안 보여서 눈으로는 멀쩡한데 트랙패드로 옆으로 쓸면 빈 공간과 서랍이
        끌려 나온다. 루트에서 못을 박는다.
      */
      html { overflow: hidden; }

      /*
        ── 3분할 골격 (L-1) ────────────────────────────────────────
        데스크톱 `zelusSandBox` 의 화면 구성을 그대로 옮긴다:
        왼쪽 3D 아바타 / 가운데 2D 재단 도면 / 오른쪽 설정.

        **이전에는 캔버스가 화면 전체였다** (`#view { position: fixed; inset: 0 }`).
        그래서 상단 바가 캔버스를 **덮고** 있었다. 바가 흐름 안으로 들어온 지금은
        덮지 않는다.

        ⚠️ **`viewer3d/viewer.ts` 의 `#fitDrafting()` 이 그 전제 위에 서 있다.**
           거기 `pad = 1.28` 은 "800px 중 실제로 보이는 띠가 690px 뿐" 이라는
           실측에서 나온 값이고, 그 690px 의 근거가 바로 **상단 바가 캔버스를
           덮는다**는 사실이었다. L-1 이 그 전제를 무너뜨렸다 — 이제 캔버스의
           세로 전부가 보이므로 도면이 필요 이상으로 작게 잡힌다.
           **L-1 에서는 고치지 않는다.** 2D 를 어느 칸에 어떤 카메라로 그릴지가
           L-2 에서 정해지고, 그때 이 값을 다시 재는 것이 맞다.

        ── 칸 폭을 이렇게 정한 근거 ────────────────────────────────
        `minmax(0, 1fr) minmax(0, 1fr) minmax(0, 24rem)`

        ① **`minmax(0, …)` 의 0 이 핵심이다.** 그냥 `1fr` 은 `minmax(auto, 1fr)`
           이라 트랙의 최소값이 내용의 min-content 가 된다. 캔버스처럼 고유
           크기(width/height 속성)를 가진 요소가 들어가면 **칸이 그 아래로
           안 줄어들어** 창을 좁혀도 가로 스크롤이 생긴다. 그 고전적인 함정을
           트랙 쪽에서 막는 것이 `minmax(0, …)` 이고, 아이템 쪽에서 막는 것이
           아래 `.cell` 의 `min-width/min-height: 0` 이다. **둘 다 필요하다** —
           앞의 것은 트랙 크기를, 뒤의 것은 아이템이 자기 칸을 넘치는 것을 막는다.
        ② 세 번째 칸이 `24rem`(384px)인 이유: L-3 이 옮겨올 파라미터 패널이
           지금 `min(26rem, 34vw)` = 1280px 에서 416px 로 그려져 있다. 그보다
           조금 좁히면서(툴바가 없어져 여백이 준다) 두 뷰포트에 1280px 기준
           896px 를 남기는 값이 24rem 이다.
        ③ 두 뷰포트가 `1fr : 1fr` 인 이유: 데스크톱 앱이 3D/2D 듀얼 뷰포트를
           같은 크기로 놓는다. 어느 쪽이 더 커야 하는지는 **실제로 2D 가
           들어와 봐야**(L-2) 알 수 있으므로 지금 기울여 두지 않는다.
        ④ **min 이 0 이었다가 `20rem` 이 됐다.** 원래 근거는 "창이 좁아지면
           설정 칸이 먼저 줄어드는 것이 맞다. 고정폭으로 두면 좁은 창에서
           뷰포트가 0 이 된다" 였고, 그 자체는 옳았다. 문제는 **양쪽 다
           나쁘다는 것**이다 — 최소가 0 이면 슬라이더 29개와 치수 25개가
           들어 있는 칸이 250px 아래에서 이름과 숫자가 겹쳐 못 읽는다.

           그래서 "좁으면 칸을 줄인다" 를 **"좁으면 칸을 격자에서 뺀다"** 로
           바꿨다. 아래 `body.narrow` 가 그 갈래다. 칸이 없어지면 뷰포트가
           자리를 다 쓰므로 min 을 박아도 안전하다.
      */
      /*
        ⚠️ **고정폭에서 시스템 산세리프로 바꿨다 (T-1).** 데스크톱 앱이 산세리프를
           쓰는 데다, 고정폭은 한글에서 자간이 벌어져 슬라이더 29개짜리 칸이
           필요 이상으로 길어졌다.
        ★ 그래도 **숫자는 자리가 고정돼야 한다** — 값이 1 자리에서 2 자리로
          바뀔 때마다 오른쪽 끝이 흔들리면 슬라이더를 미는 동안 눈이 따라간다.
          그것은 글꼴이 아니라 `font-variant-numeric: tabular-nums` 의 일이고,
          숫자가 서는 자리마다 이미 걸려 있다.
      */
      body {
        font: 13px/1.5 -apple-system, "Segoe UI", "Malgun Gothic", Roboto,
              "Noto Sans KR", "Helvetica Neue", Arial, sans-serif;
        overflow: hidden;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(20rem, 24rem);
        /*
          네 층이다 (L-4): 메뉴바 · 툴바 · 본문 세 칸 · 상태 바. 바깥 세 층은
          자기 높이만큼(버튼이 줄바꿈되면 두 줄) 쓰고 남는 전부가 본문이다.
        */
        grid-template-rows: auto auto minmax(0, 1fr) auto;
      }

      /*
        ── 좁은 창: 세 번째 칸이 서랍이 된다 ─────────────────────

        ★ **문턱(900px)이 여기 없다.** `src/panels/sideDrawer.ts` 의
          `NARROW_MAX_PX` 하나가 정본이고, `main.ts` 가 `matchMedia` 로 듣고
          `<body>` 에 `.narrow` 를 건다. 미디어 쿼리를 여기에 또 적으면 같은
          숫자가 두 곳이 되고, 한쪽만 고치는 날 "버튼은 있는데 칸이 그대로"
          가 된다.

        ★ **`position: fixed` 를 쓰지 않았다.** 서랍이 상단 바를 덮으면 안
          되는데 바 높이는 버튼이 줄바꿈되면 달라진다(`grid-template-rows` 의
          `auto`). 대신 칸을 격자에 그대로 두고 **두 뷰포트와 같은 칸에 겹쳐**
          오른쪽에 붙인다 — 격자가 이미 "바를 뺀 자리" 를 알고 있으므로 JS 가
          잴 숫자가 없다.

        `transform` 으로 미는 이유: `hidden`/`display:none` 으로 지우면 안쪽
        패널이 크기 0 이 되고, 다시 열 때 `ui/sideTabs.ts` 가 기억해 둔 스크롤
        위치가 0 으로 잘려 들어간다. `transform` 은 레이아웃을 안 건드린다.
      */
      body.narrow {
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      }

      body.narrow #sidePanel {
        grid-column: 1 / -1;
        grid-row: 3;
        justify-self: end;
        width: min(24rem, 92vw);
        z-index: 40;
        background: var(--panel);
        border-left: 1px solid var(--line-soft);
        box-shadow: -12px 0 28px rgba(0, 0, 0, 0.5);
        /* 101% 는 그림자까지 화면 밖으로 뺀다. 100% 면 그림자가 가장자리에 남는다 */
        transform: translateX(101%);
        transition: transform 0.18s ease;
        /* 닫힌 서랍이 화면 밖에서 클릭을 먹지 않게 한다. `inert` 를 지원하지
           않는 브라우저에서 남는 마지막 방어이기도 하다 */
        pointer-events: none;
      }

      body.narrow.sideOpen #sidePanel {
        transform: none;
        pointer-events: auto;
      }

      @media (prefers-reduced-motion: reduce) {
        body.narrow #sidePanel { transition: none; }
      }

      /* 여닫기 버튼은 `ui/sideDrawer.ts` 가 상단 바 끝에 만든다.
         넓은 창에서는 `hidden` 이라 자리를 차지하지 않는다. */
      #sideToggle { margin-left: 0.25rem; }

      /*
        칸의 공통 골격. **`position: relative` 는 장식이 아니라 배선이다** —
        `#hint`·`#unfoldWrap` 이 `position: fixed`(화면 기준)에서
        `position: absolute`(칸 기준)로 바뀌면서 이 요소를 기준으로 삼는다.

        `min-width/min-height: 0` 은 위 ①의 아이템 쪽 절반이고,
        `overflow: hidden` 은 칸 안의 것이 옆 칸을 침범하지 않게 한다.
      */
      .cell { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
      .cell + .cell { border-left: 1px solid var(--line-soft); }
      /*
        칸의 자리를 **명시적으로** 박는다. 자동 배치에 맡기면 순서가 DOM 순서에
        묶이는데, 아래 `#paramsWrap`·`#logWrap` 은 `position: fixed` 라 격자
        아이템이 아니면서도 소스 한가운데에 있다. 명시해 두면 소스 순서를
        바꾸든 사이에 무엇이 끼든 화면 배치가 흔들리지 않는다.
      */
      #viewport3d { grid-column: 1; grid-row: 3; }
      #viewport2d { grid-column: 2; grid-row: 3; }
      #sidePanel  { grid-column: 3; grid-row: 3; }

      /*
        캔버스는 **흐름에서 빼서** 칸을 꽉 채운다.

        `position: absolute` 인 이유는 크기 계산의 방향을 뒤집기 위해서다.
        흐름 안에 두면 캔버스의 고유 크기(three 가 `setSize` 로 넣는 width/height
        속성)가 칸의 min-content 에 섞여, **캔버스가 커지면 칸이 커지고 칸이
        커지면 캔버스가 커지는** 되먹임이 생길 수 있다. 흐름에서 빼면 크기는
        한 방향으로만 흐른다: 칸 → 캔버스.

        `width/height: 100%` 를 `inset: 0` 과 **같이** 쓰는 이유: 캔버스는
        대체 요소(replaced element)라 `inset: 0` 만으로는 늘어나지 않고 고유
        크기를 유지한다.

        렌더 버퍼는 `viewer3d/viewer.ts` 의 `resize()` 가 `clientWidth/Height`
        를 읽어 맞춘다. 같은 파일의 `ResizeObserver` 가 이 캔버스를 관찰하므로,
        칸이 줄면 캔버스의 border-box 가 줄고 → 옵저버가 발화하고 → 렌더 버퍼가
        따라온다. `setSize(w, h, false)` 의 `false` 가 three 로 하여금 style 을
        건드리지 않게 하므로, 크기의 정본은 끝까지 이 CSS 다.
      */
      /*
        두 캔버스가 **같은 규칙**을 쓴다. 가운데 칸의 `#view2d`(L-2a)도 자기
        칸을 꽉 채우고, 크기의 정본은 똑같이 CSS 다 — `Viewer2D` 의 `resize()`
        가 `clientWidth/Height` 를 읽고 `setSize(w, h, false)` 로 넘긴다.
      */
      #view, #view2d { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

      /*
        빈 자리 표시. **툴팁이 아니라 화면에 보이는 글자여야 한다** — 어느
        단위가 여기를 채우는지 모르면 "덜 만든 것"과 "고장난 것"을 구분할 수 없다.
      */
      .todo {
        position: absolute; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 0.35rem; text-align: center; padding: 1rem;
        opacity: 0.35;
      }
      .todo b { font-weight: 600; font-size: 14px; }
      .todo span { font-size: 12px; }
      /*
        ⚠️ **이 한 줄이 없으면 `hidden` 이 듣지 않는다.** 브라우저 기본 스타일의
           `[hidden] { display: none }` 은 작성자 규칙에 진다 — 위의
           `display: flex` 가 이겨서, `main.ts` 가 `hidden = true` 로 놔도 글자가
           도면 위에 그대로 뜬다(L-2a 에서 실제로 그렇게 나왔다). 속성과 화면이
           갈라지면 콘솔로는 "숨겼다" 고 나오는데 눈에는 보이므로, 원인을
           찾기 전까지 렌더링 쪽을 의심하게 된다.
      */
      .todo[hidden] { display: none; }

      /*
        아바타 체형 패널 (L-3a). **`#params` 의 위젯 규칙을 재사용한다** —
        `.pbar`·`.pbanner`·`.pgroup`·`.prow`·`.phead` 가 이미 정의돼 있고,
        같은 화면 안에서 두 패널이 다르게 생길 이유가 없다. 여기에는 이 칸에만
        필요한 것(칸 전체를 채우고 스스로 스크롤)과 슬라이더 행 하나만 더한다.

        `#params` 와 달리 `max-height` 를 안 쓰는 이유: 저쪽은 화면에 떠 있는
        오버레이라 자기 높이를 스스로 재야 하지만, 이쪽은 격자 칸 안이라
        **칸이 높이를 정한다.** 칸에 `min-height: 0` 이 걸려 있어(위 `.cell`)
        이 상자의 `overflow-y: auto` 가 제대로 발동한다.
      */
      /*
        ── 오른쪽 칸의 탭 (L-3c) ───────────────────────────────────
        원래는 체형(L-3a)과 옷 사이즈(L-3b)가 **한 스크롤 안에 이어져** 있었다.
        78행(슬라이더 29 + 치수 25 + 패턴 24)이 한 줄로 서면 아래쪽 옷 사이즈는
        사실상 안 보인다 — 막대가 짧아져 "더 있다" 는 신호조차 흐려진다.
        탭으로 가르면 두 목록이 각자 온전한 스크롤을 갖는다.

        ★ **스크롤 주인이 바뀌었다.** `#sideScroll` 이 `position: absolute;
          inset: 0` 로 칸을 통째로 덮고 있었는데, 그 상태로 탭 바를 안에 넣으면
          바가 내용과 함께 굴러 올라가 버린다. 그래서 칸을 세로 flex 로 만들고
          바는 `flex: 0 0 auto`(고정), 내용만 `flex: 1`(스크롤)로 나눈다.
          `min-height: 0` 이 없으면 flex 아이템의 기본 최소 크기가 내용
          높이가 되어 **스크롤이 아예 안 생긴다** — `.cell` 의 것과 같은 함정이
          한 층 안쪽에서 되풀이된다.
      */
      /*
        ⚠️ **바탕색이 있어야 한다 (T-1).** 없으면 `body` 의 `--bg` 가 비쳐
           뷰포트와 같은 색이 되고, 데스크톱처럼 "설정은 한 단 밝은 판" 이라는
           구분이 사라진다. 좁은 창에서 서랍이 될 때 이미 같은 색을 깔고 있었다
           (위 `body.narrow #sidePanel`) — 그 값을 넓은 창에도 맞춘 것이다.
      */
      #sidePanel { display: flex; flex-direction: column; background: var(--panel); }

      #sideTabs {
        flex: 0 0 auto;
        display: flex; gap: 0.25rem;
        padding: 0.4rem 0.5rem 0;
        border-bottom: 1px solid var(--line-soft);
        background: var(--panel);
      }
      /* 탭은 버튼이지만 상단 바의 버튼처럼 보이면 안 된다 — 누르는 것이 아니라
         "지금 어디에 있는가" 를 말하는 물건이다 */
      .stab {
        font: inherit; font-size: 12px; color: inherit; cursor: pointer;
        background: none; border: none; border-bottom: 2px solid transparent;
        border-radius: 0; padding: 0.3rem 0.6rem; margin-bottom: -1px;
        opacity: 0.5;
      }
      .stab:hover { background: var(--hover); opacity: 0.8; }
      .stab.on { opacity: 1; border-bottom-color: var(--accent); background: none; }

      #sideScroll {
        flex: 1 1 auto; min-height: 0;
        overflow-y: auto; padding: 0.5rem;
        font-size: 12px;
      }
      /*
        ⚠️ **이 한 줄이 없으면 탭이 갈리지 않을 수 있다.** `.todo[hidden]` 과
           같은 이유다 — 브라우저 기본 `[hidden] { display: none }` 은 작성자
           규칙에 지므로, 두 상자에 나중에 `display:` 가 붙는 순간 `hidden` 이
           조용히 무력해진다(L-2a 에서 실제로 겪었다). 속성과 화면이 갈라지면
           콘솔에는 아무 이상이 없어 보인다. `ui/sideTabs.ts` 가 이 표식을
           두 상자에 붙인다.
      */
      #sideScroll > .sidepane[hidden] { display: none; }
      /* 두 패널이 위젯 규칙을 공유한다 */
      #sideScroll input[type="number"] {
        font: inherit; color: inherit; width: 5rem;
        background: var(--ctl); border: 1px solid var(--line); border-radius: 4px;
        padding: 0.1rem 0.3rem;
      }
      #sideScroll button { padding: 0.15rem 0.5rem; }
      #sideScroll button:disabled { opacity: 0.45; cursor: default; }
      /* 옷 사이즈 행 — 이름 아래에 [폭 × 높이] [적용] [↺] 가 한 줄로 온다 */
      .srow .pinputs { flex-wrap: wrap; }
      .srow.dirty { border-left: 2px solid var(--accent); padding-left: 0.35rem; }

      #avatarPanel input[type="range"] {
        width: 100%; accent-color: var(--accent); margin: 0.15rem 0 0;
      }
      #avatarPanel button { padding: 0.15rem 0.5rem; }
      #avatarPanel .phead { justify-content: space-between; }
      /* 편집된 행은 **테두리로** 표시한다. 글자색만 바꾸면 비활성·경고와 섞인다 */
      .arow.dirty { border-left: 2px solid var(--accent); padding-left: 0.35rem; }
      .anum { opacity: 0.6; font-variant-numeric: tabular-nums; }
      /* 치수는 읽기 전용이라 행이 얇다. 이름과 값을 양끝으로 민다 */
      .amrow { display: flex; justify-content: space-between; gap: 0.5rem; opacity: 0.75; }
      .amrow b { font-weight: 600; font-variant-numeric: tabular-nums; }

      /*
        치수 편집 (W-2). 행은 `이름 ─── [숫자]` 한 줄 + 아래에 현재값/근사 차이.
        `.srow`(옷 사이즈)와 같은 계열이되 [적용] 이 행마다가 아니라 하나뿐이라
        입력이 제목 줄에 그대로 붙는다.
      */
      #avatarMeasure { margin-top: 0.9rem; border-top: 1px solid var(--line-soft); padding-top: 0.5rem; }
      .mrow.dirty { border-left: 2px solid var(--accent); padding-left: 0.35rem; }
      .mrow .phead { justify-content: space-between; align-items: center; }
      .mrow .phelp { font-variant-numeric: tabular-nums; }
      /*
        ⚠️ 사유·진행·결과가 나오는 한 줄이다. **툴팁이 아니라 화면 글자**라야
           한다(#16). `hidden` 이 듣도록 `display` 를 여기에 두지 않는다.
      */
      .mstat { margin: 0.3rem 0; opacity: 0.8; line-height: 1.45; }
      .mstat.err { color: var(--err); opacity: 1; }

      /*
        ── 1층: 메뉴바 (L-4) ───────────────────────────────────────
        데스크톱 앱의 맨 윗줄을 옮긴 것이다. 왼쪽이 메뉴, 가운데가 지금 열려
        있는 문서, 오른쪽이 화면 전체에 걸리는 조작(언어 · 설정 칸 여닫기)이다.

        ★ **가운데 제목이 진짜 가운데다.** 좌우 상자에 `flex: 1 1 0` 으로 같은
          몫을 주고 제목을 그 사이에 둔다. 제목만 `margin: auto` 로 밀면 왼쪽
          메뉴 글자가 길어질 때(언어를 바꾸면 길이가 달라진다) 제목이 같이 밀려
          창 가운데에서 벗어난다.
      */
      .menubar {
        grid-column: 1 / -1; grid-row: 1; z-index: 6;
        display: flex; align-items: center; gap: 0.35rem;
        padding: 0.15rem 0.5rem;
        background: var(--chrome);
        border-bottom: 1px solid var(--line-soft);
        /* 메뉴는 본문보다 한 급 작다 — 늘 떠 있는 글자라 눈에 덜 걸려야 한다 */
        font-size: 12px;
      }
      .menubar .mgroup {
        display: flex; align-items: center; gap: 0.15rem;
        flex: 1 1 0; min-width: 0;
      }
      .menubar .mright { justify-content: flex-end; }
      .menubar .mright label { opacity: 0.55; }
      /* 긴 씬 이름이 메뉴를 밀어내지 않게 자른다. 전체 이름은 title 툴팁이다 */
      .mtitle {
        flex: 0 1 auto; min-width: 0;
        opacity: 0.7; font-size: 12px;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .menubtn {
        background: none; border: 1px solid transparent; border-radius: 3px;
        padding: 0.1rem 0.45rem; opacity: 0.8;
      }
      .menubtn:hover:not(:disabled) { background: var(--hover); opacity: 1; }
      .menubtn[aria-expanded="true"] { background: var(--accent-dim); opacity: 1; }
      /*
        ⚠️ 열린 메뉴는 **본문 위에 떠야 한다.** 흐름 안에 두면 메뉴가 열릴 때
           메뉴바가 그만큼 높아져 본문 세 칸이 통째로 내려간다 — 열고 닫을
           때마다 뷰포트가 출렁인다.
      */
      .menuroot { position: relative; }
      .menupop {
        position: absolute; left: 0; top: calc(100% + 0.2rem); z-index: 20;
        min-width: 21rem; padding: 0.45rem;
        display: flex; flex-direction: column; gap: 0.4rem;
        background: var(--panel-hi); border: 1px solid var(--line); border-radius: 4px;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.5);
      }
      /* 브라우저 기본 `[hidden]` 이 위 `display: flex` 에 진다 — 못을 박는다 */
      .menupop[hidden] { display: none; }
      .menurow { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; }
      .menurow > label:not(.filebtn) { opacity: 0.55; }
      .menusep { height: 1px; background: var(--line-soft); margin: 0.1rem 0; }

      /*
        ── 2층: 툴바 (L-4) ─────────────────────────────────────────
        왼쪽 무리가 3D 칸, 오른쪽 무리가 2D 칸에 걸리는 조작이다 — 데스크톱도
        아이콘을 두 무리로 갈라 각 뷰포트 위에 얹는다.

        ⛔ 데스크톱에 있는 도형·아바타 생성 아이콘은 **일부러 안 만들었다.**
           웹에 대응 기능이 없다 — 눌러도 아무 일 없는 아이콘은 이 화면이
           없애려던 바로 그 거짓말이다.
      */
      .bar {
        grid-column: 1 / -1; grid-row: 2; z-index: 4;
        display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem;
        padding: 0.3rem 0.75rem;
        background: var(--panel);
        backdrop-filter: blur(6px);
        border-bottom: 1px solid var(--line-soft);
      }
      .tgroup {
        display: flex; align-items: center; gap: 0.5rem;
        flex-wrap: wrap; min-width: 0;
      }

      /*
        ── 4층: 상태 바 (L-4) ──────────────────────────────────────
        `#status` 는 **사용자에게 하는 말**이고 `#sim`·`#frames`·`#stat` 은
        계측값이라 좌우로 갈라 둔다. 가운데는 데스크톱의 "Design mode" 자리다.

        ★ `position: relative` 는 장식이 아니라 배선이다 — 로그 상자가 이 바를
          기준으로 위쪽에 뜬다(아래 `#log`).
      */
      .statusbar {
        position: relative;
        grid-column: 1 / -1; grid-row: 4; z-index: 5;
        display: flex; align-items: center; gap: 0.6rem;
        padding: 0.15rem 0.75rem; min-height: 1.7rem;
        background: var(--chrome);
        border-top: 1px solid var(--line-soft);
        font-size: 12px;
      }
      .modelabel { opacity: 0.5; }
      select, button, input[type="file"] {
        font: inherit; color: inherit;
        background: var(--ctl); border: 1px solid var(--line); border-radius: 4px;
        padding: 0.25rem 0.5rem;
      }
      select { max-width: 26rem; }
      button { cursor: pointer; }
      button:hover:not(:disabled) { background: var(--ctl-hi); }
      button:disabled, select:disabled { opacity: 0.45; cursor: default; }

      /*
        ── 조작 요소의 결 (T-1) ────────────────────────────────────
        데스크톱의 값 상자와 슬라이더를 옮긴 것이다. 여기 있는 것은 **모든 칸에
        걸리는 바탕**이고, 폭처럼 자리마다 다른 값은 각 칸의 규칙에 남겼다.
      */

      /* 값 상자 — 오른쪽 정렬에 자리 고정. 슬라이더를 미는 동안 숫자의 오른쪽
         끝이 흔들리면 눈이 값이 아니라 그 흔들림을 따라간다 */
      input[type="number"] { text-align: right; font-variant-numeric: tabular-nums; }

      /* 키보드로 왔을 때만 테두리를 밝힌다. 마우스로 누를 때마다 번쩍이면
         "잘못 눌렀나" 로 읽힌다 */
      button:focus-visible, select:focus-visible, input:focus-visible,
      summary:focus-visible, .stab:focus-visible {
        outline: 2px solid var(--accent-hi); outline-offset: 1px;
      }

      /*
        슬라이더 (T-1). 브라우저 기본은 홈이 두껍고 흐려서 값이 어디쯤인지 한눈에
        안 들어온다. 데스크톱처럼 **가는 홈에 동그란 손잡이**로 바꾼다.

        ⚠️ `accent-color` 로는 색만 바뀌고 **두께는 못 바꾼다.** 두께를 바꾸려면
           홈과 손잡이를 직접 그려야 하고, 그러려면 엔진별 의사요소가 두 벌
           필요하다(`::-webkit-slider-*` 와 `::-moz-range-*`). 한쪽만 적으면
           다른 브라우저에서 **손잡이가 통째로 사라진다** — 값을 못 바꾸는데
           화면은 멀쩡해 보이는, 가장 알아채기 어려운 고장이다.
        ⚠️ `margin-top` 은 (홈 두께 3px - 손잡이 12px) / 2 다. 두 값 중 하나를
           고치면 여기도 같이 고쳐야 손잡이가 홈 가운데에 선다. Firefox 는
           스스로 가운데를 맞추므로 이 줄이 없다.
      */
      input[type="range"] {
        -webkit-appearance: none; appearance: none;
        background: none; height: 1rem; cursor: pointer;
      }
      input[type="range"]::-webkit-slider-runnable-track {
        height: 3px; border-radius: 2px; background: var(--line);
      }
      input[type="range"]::-moz-range-track {
        height: 3px; border-radius: 2px; background: var(--line);
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none; appearance: none;
        width: 12px; height: 12px; margin-top: -4.5px;
        border: none; border-radius: 50%; background: var(--text);
      }
      input[type="range"]::-moz-range-thumb {
        width: 12px; height: 12px;
        border: none; border-radius: 50%; background: var(--text);
      }
      input[type="range"]:disabled { cursor: default; }
      input[type="range"]:disabled::-webkit-slider-thumb { background: var(--line); }
      input[type="range"]:disabled::-moz-range-thumb { background: var(--line); }

      /* 체크박스는 강조색을 그대로 쓴다 — 켜짐/꺼짐이 색 하나로 갈린다 */
      input[type="checkbox"] { accent-color: var(--accent); }

      /*
        스크롤막대. 기본은 밝은 회색이라 어두운 칸에서 홀로 튄다 — 오른쪽 칸은
        슬라이더 29개 + 치수 25개라 스크롤이 늘 서 있는 자리다.
      */
      * { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
      .spacer { flex: 1 1 auto; }

      /*
        파일 선택 (I-1). 네이티브 입력의 글자를 번역할 수 없어서 입력을 감추고
        `<label>` 을 버튼처럼 쓴다.

        ⚠️ `display:none`·`visibility:hidden` 을 쓰지 마라 — 요소가 포커스를
           못 받아 `verify/ui.ts:1568` 의 `page.focus('#file')` 이 깨진다.
           아래 clip 방식은 화면에서만 사라지고 요소는 살아 있다.
        ⚠️ `.bar label { opacity: .55 }` 가 위에 있어서 그대로 두면 버튼만
           흐리게 나온다. 여기서 되돌린다.
      */
      .sr-only {
        position: absolute; width: 1px; height: 1px;
        margin: -1px; padding: 0; border: 0;
        clip: rect(0 0 0 0); clip-path: inset(50%); overflow: hidden;
        white-space: nowrap;
      }
      /*
        ⚠️ **선택자에 자리를 박지 말 것.** 원래 `.bar label.filebtn` 이었는데,
           파일 입력이 [파일] 메뉴로 옮겨가면서 그 조건에서 벗어나 **버튼 모양을
           통째로 잃었다.** 화면에는 "파일 선택" 이 그냥 글자로 남아, 누를 수 있는
           것인지 알 수 없었다(실제로 사용자가 못 찾았다). 이 라벨은 어디에 있든
           버튼이다 — 모양은 자리가 아니라 역할에서 나온다.
      */
      label.filebtn {
        opacity: 1; cursor: pointer;
        background: var(--ctl); border: 1px solid var(--line); border-radius: 4px;
        padding: 0.25rem 0.5rem;
      }
      label.filebtn:hover { background: var(--ctl-hi); }
      /* 키보드로 옮겨왔을 때 감춘 입력 대신 라벨이 초점을 드러낸다 */
      .sr-only:focus-visible + .filebtn { outline: 2px solid var(--accent-hi); outline-offset: 1px; }
      .filename {
        opacity: 0.55; max-width: 14rem;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }

      #status { opacity: 0.8; }
      #status.err { color: var(--err); opacity: 1; }
      .stat { opacity: 0.5; }
      .stat b { font-weight: 600; opacity: 0.95; }
      /*
        드레이프의 사유·결과 (W-1). 다른 `.stat` 보다 진하다 — 이건 계측값이
        아니라 **사용자에게 하는 말**이라, 흐리게 두면 "안 보이는 글자" 가 된다.
        "자동 드레이프가 없다" 는 오류가 아니므로 빨갛게 칠하지 않는다(.err 만).
      */
      #drapestat { opacity: 0.85; }
      #drapestat.err { color: var(--err); opacity: 1; }

      /*
        3D 조작 힌트. 화면 기준(fixed) → **3D 칸 기준**(absolute)으로 바뀐다.
        조작 설명은 3D 뷰포트에 딸린 것이지 화면 전체에 딸린 것이 아니다.

        ⚠️ **아래가 아니라 위인 이유** (L-1 에서 바뀐 자리다):
           이 문구는 단축키까지 붙어 690px 남짓 뻗는다(실측 근거는 아래
           `#unfoldWrap` 주석에 있다). 3D 칸은 1280px 에서 448px 뿐이라 아래에
           그대로 두면 **두 줄로 접히면서 위로 자라고**, 그 자리는 화면 왼쪽
           아래에 `position: fixed` 로 박혀 있는 `#paramsWrap`(416px 폭,
           bottom 2.4rem)이 이미 쓰고 있다 — 글자 위에 글자가 찍힌다.
           `#paramsWrap` 은 L-3 이 오른쪽 칸으로 옮길 물건이라 여기서 만지지
           않는다. 대신 이번에 **바가 캔버스를 덮지 않게 되면서 비어난** 칸
           위쪽으로 옮긴다. 두 줄로 접히는 것은 그대로 허용한다 — 잘라서
           숨기면 단축키 안내가 화면에서 사라진다.
      */
      /*
        ⚠️ `max-width` 가 **칸 전체에서 오른쪽 위를 뺀 만큼**으로 줄었다 (AM-1).
           이 문구는 단축키까지 붙어 690px 남짓 뻗어 3D 칸(1280px 에서 448px)
           에서 두 줄로 접히는데, 그 두 줄이 칸 폭을 다 쓰면 오른쪽 위의
           아바타 스위치(`#view3dOpts`)와 글자가 겹쳐 찍힌다. 힌트는
           `pointer-events: none` 이라 클릭은 안 뺏지만 **읽을 수 없게 된다.**
           줄이면 세 줄로 접힐 뿐이고, 잘라서 숨기지는 않는다.

           15.5rem 의 근거(실측, 창 1450px → 3D 칸 533px): 스위치 상자가
           오른쪽 0.5rem 에서 시작해 최대 14rem 을 쓰므로 오른쪽에서
           14.5rem 이 예약된다. 힌트는 왼쪽 0.75rem 에서 시작하니 그만큼을
           더 빼야 두 상자가 안 만난다 — 13rem 으로 뒀을 때 실제로 19px
           겹쳤다.
      */
      #hint {
        position: absolute; left: 0.75rem; top: 0.5rem; z-index: 2;
        max-width: calc(100% - 1.5rem);
        opacity: 0.35; pointer-events: none;
      }

      /*
        ── 실시간 뷰의 아바타 스위치 (AM-1) ──────────────────────
        칸 **오른쪽 위**에 둔다. 왼쪽 위는 `#hint`, 아래 가운데는
        `#unfoldWrap`, 화면 왼쪽 아래는 `#paramsWrap`(fixed) 가 이미 쓴다.

        가운데 칸의 `#draft2dOpts`(D2-e)와 **같은 규칙·같은 클래스**다:
        상자는 `pointer-events: none`, 라벨만 `auto`. 상자가 통째로 클릭을
        먹으면 그 사각형 안에서는 3D 를 회전시킬 수 없다.

        `text-align: right` 는 장식이 아니다 — 상태 글자가 "몸을 받는 중…
        (1.9MB)" 에서 "아바타 1 · 정점 28,564" 로 길이가 오가는데, 왼쪽
        정렬이면 그때마다 오른쪽 끝이 들쭉날쭉해진다.
      */
      /*
        ⚠️ **폭에 상한이 있어야 한다.** 상태 글자는 "아바타 1 · 정점 28,564"
           에서 "이 씬에는 시뮬에 참여하는 아바타가 없습니다" 나 실패 사유까지
           길이가 크게 오간다. 상한이 없으면 긴 글자가 왼쪽으로 뻗어 `#hint` 를
           덮는다 — 위 `#hint` 의 15.5rem 이 이 14rem 과 짝이다. 넘치면 잘리지
           않고 **여러 줄로 접힌다**(글자가 사라지면 안 된다).
      */
      /*
        ⚠️ **툴바로 나오면서 `position: absolute` 를 뗐다.** 캔버스 위에 겹쳐
           있을 때는 조작을 가리지 않으려고 `pointer-events: none` 이 필요했는데,
           이제 캔버스 위가 아니므로 그것도 뗐다 — 남겨 두면 라벨만 눌리고 상태
           글자는 선택조차 안 되는 어중간한 상태가 된다.
      */
      #view3dOpts {
        display: flex; flex-wrap: wrap; align-items: center; gap: 0.15rem 0.6rem;
        min-width: 0; font-size: 11px;
      }
      /* 상태 글자. 계측값이 아니라 **사용자에게 하는 말**이라 흐리게 두지 않는다 */
      .dstat { opacity: 0.6; }
      .dstat.err { color: var(--err); opacity: 1; }
      .dstat:empty { display: none; }

      /*
        파라미터 패널 (#16). `#logWrap` 과 **같은 패턴**이다 — 바닥에 고정해
        `<details>` 로 접고, 펼치면 위로 자란다. 상단 `.bar` 를 건드리지 않은
        이유는 거기가 `src/verify/ui.ts` 의 판정면(버튼 위치·상태 글자)이라서다.
        왼쪽 아래에 두어 오른쪽 아래의 로그와 겹치지 않는다
        (1280px 에서 416px + 588px < 1280px).
      */
      /* `bottom` 은 상태 바 높이(1.7rem)를 비킨 값이다. 이 상자는 다음 단계에서
         오른쪽 칸의 [시뮬레이션] 탭으로 들어가고, 그때 이 규칙은 없어진다 */
      #paramsWrap {
        position: fixed; left: 0.75rem; bottom: 2.4rem; z-index: 2;
        width: min(26rem, 34vw);
      }
      #paramsWrap summary { cursor: pointer; opacity: 0.45; }
      #paramsWrap[open] summary { opacity: 0.75; }
      #paramsBadge { opacity: 0.75; }
      #params {
        margin-top: 0.4rem; padding: 0.5rem;
        max-height: 64vh; overflow-y: auto;
        background: var(--panel-hi);
        border: 1px solid var(--line-soft); border-radius: 4px;
        font-size: 12px;
      }
      /* 위젯 스타일은 전부 `#params` 안으로 가둔다 — 바깥 규칙을 바꾸지 않는다 */
      #params input[type="number"] {
        font: inherit; color: inherit; width: 6.5rem;
        background: var(--ctl); border: 1px solid var(--line); border-radius: 4px;
        padding: 0.1rem 0.3rem;
      }
      #params input[type="range"] { flex: 1 1 auto; min-width: 4rem; accent-color: var(--accent); }
      #params select { max-width: none; flex: 1 1 auto; padding: 0.1rem 0.3rem; }
      #params button { padding: 0.15rem 0.5rem; }
      #params input:disabled, #params select:disabled { opacity: 0.45; cursor: default; }

      .pbar {
        position: sticky; top: -0.5rem; z-index: 1;
        display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap;
        margin: -0.5rem -0.5rem 0.45rem; padding: 0.5rem;
        background: var(--panel); border-bottom: 1px solid var(--line-soft);
      }
      .pbanner {
        margin-bottom: 0.45rem; padding: 0.35rem 0.45rem; border-radius: 3px;
        background: rgba(255, 200, 120, 0.09); border: 1px solid var(--warn-line); color: var(--warn);
      }
      .phint { margin-bottom: 0.45rem; opacity: 0.55; }
      .pgroup { margin-top: 0.6rem; }
      /* 데스크톱의 `simulation speed` 같은 소제목 자리다. 흐리게 두되 굵기로
         구분한다 — 선까지 진하면 항목마다 칸이 갈린 것처럼 보인다 */
      .pgroup > h4 {
        margin: 0.2rem 0 0.35rem; font-size: 11px; font-weight: 700;
        letter-spacing: 0.02em; opacity: 0.55;
        padding-bottom: 0.2rem; border-bottom: 1px solid var(--line-soft);
      }
      .prow { padding: 0.35rem 0; border-bottom: 1px solid var(--line-soft); }

      /*
        드레이핑 보드 (DB-1). 카드 격자다 — 목록의 다른 표(`.prow`)와 달리
        **미리보기 그림이 고르는 근거**라서, 이름 옆에 작게 붙이는 대신
        그림을 칸의 주인공으로 놓는다. 실측 썸네일이 512×512 정사각이다.

        ⚠️ `minmax(0, 1fr)` 의 0 이 필요하다 — 그냥 `1fr` 이면 긴 아이템
           이름이 트랙을 밀어 칸이 사이드바 밖으로 삐져나간다.
      */
      #drapingPanel .dgrid {
        display: grid; gap: 0.4rem; margin-top: 0.4rem;
        grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
      }
      .dcard {
        display: flex; flex-direction: column; gap: 0.2rem; padding: 0.3rem;
        border: 1px solid var(--line-soft); border-radius: 4px; background: var(--chrome);
        cursor: pointer; text-align: left; color: inherit; font: inherit;
        min-width: 0;
      }
      .dcard:hover { border-color: var(--line); }
      /* 고른 것과 **엔진이 적용 중인 것**은 다른 표시다 — 아래 주석 참고 */
      .dcard.sel { border-color: var(--accent-hi); background: var(--accent-dim); }
      .dcard .dthumb {
        width: 100%; aspect-ratio: 1 / 1; border-radius: 3px; background: var(--bg);
        display: flex; align-items: center; justify-content: center; overflow: hidden;
      }
      .dcard .dthumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
      .dcard .dthumb .dnone {
        font-size: 10px; opacity: 0.45; padding: 0.2rem; text-align: center; line-height: 1.3;
      }
      /* 이름은 씬이 정한 문자열이라 길이를 우리가 못 정한다. 잘라서 보인다 */
      .dcard .dname {
        font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .dcard .dmeta { font-size: 10px; opacity: 0.5; display: flex; gap: 0.25rem; flex-wrap: wrap; }
      .dcard .dtags { display: flex; gap: 0.2rem; flex-wrap: wrap; }
      #drapingPanel .dbar { display: flex; gap: 0.35rem; align-items: center; flex-wrap: wrap; }
      #drapingPanel .dstat { font-size: 11px; opacity: 0.8; margin-top: 0.35rem; }
      #drapingPanel .dstat.err { color: var(--err); opacity: 1; }
      /* 비활성은 흐리게 **하되**, 아래 `.pwhy` 가 이유를 글자로 남긴다 */
      .prow.off { opacity: 0.75; }
      .phead { display: flex; align-items: center; gap: 0.35rem; flex-wrap: wrap; }
      .phead label { opacity: 0.9; }
      .pinputs { display: flex; align-items: center; gap: 0.4rem; margin: 0.2rem 0; }
      .pbadge {
        font-size: 10px; padding: 0 0.25rem; border-radius: 3px;
        border: 1px solid var(--line); opacity: 0.85;
      }
      .pbadge.dead { color: var(--err); border-color: var(--err-line); }
      .pbadge.conditional { color: var(--warn); border-color: var(--warn-line); }
      .pbadge.guess { opacity: 0.45; }
      .phelp, .pnote { opacity: 0.45; }
      .pwhy { color: var(--err); }
      .pfix, .psrc { color: var(--warn); }

      /*
        2D 펼침 (#15-b). 화면 기준(fixed) → **3D 칸 기준**(absolute)으로 바뀐다.
        펼침은 3D 옷의 정점을 도면 좌표로 옮기는 것이므로, 지금은 3D 칸에
        속하는 조작이 맞다. (L-2 가 2D 를 가운데 칸에 상시 렌더하면 이 슬라이더의
        소속을 다시 따져야 한다 — 그때는 두 칸을 잇는 물건이 된다.)

        접힌 `<details>` 들의 투명한 영역이 슬라이더를 삼키지 않도록 z-index 를
        하나 올려 둔 것은 그대로다.

        ⚠️ `bottom` 이 2.2rem → **0.6rem 으로 내려온 이유**:
           원래 2.2rem 이었던 것은 0.6rem 줄을 `#hint` 가 쓰고 있어서였다
           (겹치면 실측으로 "R펼침…씬 내림" 이 됐다). L-1 에서 `#hint` 가 칸
           위쪽으로 올라갔으므로 그 근거가 사라졌다.
           그리고 **0.6rem 이어야 하는 새 이유가 생겼다**: 화면 왼쪽 아래의
           `#paramsWrap` 이 `position: fixed; bottom: 2.4rem` 로 이 칸 위에
           겹쳐 있다(폭 416px = 448px 칸의 대부분). 2.2rem 에 두면 접혀 있을
           때는 그 요약줄과, 펼쳤을 때는 패널 본체와 정면으로 부딪친다.
           0.6rem 은 `#paramsWrap` 의 상자가 **끝나는 아래**라 겹치지 않는다.
           (`#unfoldWhy` 가 글자를 받으면 위로 한 줄 자라 그 경계에 닿는다 —
            배치 없는 패턴이 있을 때만이고, L-3 이 `#paramsWrap` 을 오른쪽
            칸으로 옮기면 사라지는 문제다.)
      */
      /*
        ── 재단 도면의 표시 스위치 (D2-e) ────────────────────────
        칸 **왼쪽 위**에 둔다. 아래는 `#unfoldWrap`(펼침 슬라이더)이 L-2b 에서
        올 자리이고, 오른쪽 위는 도면이 넓게 쓰는 쪽이다.

        ⚠️ `pointer-events` 를 상자에는 none, 라벨에만 auto 로 준다. 상자가
           통째로 클릭을 먹으면 그 사각형 안에서는 **도면을 팬 할 수 없다** —
           체크박스 여섯 개짜리 상자가 캔버스 조작을 가리는 셈이 된다.
      */
      /* 위 `#view3dOpts` 와 같은 이유로 겹침 배치를 뗐다 */
      #draft2dOpts {
        display: flex; flex-wrap: wrap; align-items: center; gap: 0.1rem 0.6rem;
        min-width: 0; font-size: 11px;
      }
      .dopt {
        display: flex; align-items: center; gap: 0.25rem;
        pointer-events: auto; cursor: pointer;
        opacity: 0.55; user-select: none;
      }
      .dopt:hover { opacity: 0.9; }
      /* 켜진 것을 진하게 — 꺼진 갈래가 한눈에 보여야 "왜 안 보이지" 를 막는다 */
      .dopt:has(input:checked) { opacity: 0.95; }
      .dopt input { margin: 0; cursor: pointer; }

      /*
        ⚠️ **아래 `#transport` 와 같은 자리다**(칸 아래 가운데). 위아래로 쌓아
           비켜 둔다 — 이 값은 재생 버튼 높이(약 1.9rem)에서 나온 것이라, 버튼
           크기를 바꾸면 여기도 같이 봐야 한다.
      */
      #unfoldWrap {
        position: absolute; left: 50%; transform: translateX(-50%);
        bottom: 3.1rem; z-index: 3;
        display: flex; flex-direction: column; align-items: center; gap: 0.15rem;
        max-width: calc(100% - 1.5rem);
      }
      .urow { display: flex; align-items: center; gap: 0.45rem; }
      .urow label { opacity: 0.55; }
      #unfold {
        width: 9rem; accent-color: var(--accent); vertical-align: middle;
      }
      #unfold:disabled { opacity: 0.4; cursor: default; }
      #unfoldStat { opacity: 0.6; min-width: 3.2rem; }
      /* 배치를 못 받은 패턴이 있으면 **회색만 되지 않는다** — 이유가 글자로 남는다 */
      #unfoldWhy { color: var(--warn); opacity: 0.9; text-align: center; font-size: 12px; }
      #unfoldWhy:empty { display: none; }

      /* 재생 컨트롤 (L-4). 자리 근거는 위 `#unfoldWrap` 주석 참고 */
      #transport {
        position: absolute; left: 50%; transform: translateX(-50%);
        bottom: 0.6rem; z-index: 3;
        display: flex; align-items: center; gap: 0.4rem;
      }
      #transport button {
        border-radius: 999px; padding: 0.3rem 0.85rem;
        background: var(--ctl);
      }
      #transport button:hover:not(:disabled) { background: var(--ctl-hi); }

      /*
        로그가 상태 바 안으로 들어왔다 (L-4). 여는 손잡이만 바에 서고, 펼친
        내용은 바를 기준으로 **위쪽에 뜬다** — 흐름 안에 두면 바가 화면 절반
        높이로 자라 본문을 밀어낸다.
      */
      #logWrap { margin-left: 0.1rem; }
      #logWrap summary { cursor: pointer; opacity: 0.45; text-align: right; }
      #log {
        position: absolute; right: 0.75rem; bottom: calc(100% + 0.35rem); z-index: 6;
        width: min(38rem, 46vw);
        padding: 0.5rem;
        max-height: 34vh; overflow-y: auto; white-space: pre-wrap;
        background: var(--panel-hi); border: 1px solid var(--line-soft); border-radius: 4px;
        opacity: 0.75; font-size: 12px;
      }
    </style>
  </head>
  <body>
    <!--
      #13 = 프레임 스트리밍. 옷이 **움직이는** 데까지다.
      여기 있는 재생 버튼은 시뮬을 켜기 위한 **최소 트리거**일 뿐이다 —
      제대로 된 재생 컨트롤(타임라인·프레임 스크럽)은 #14, 2D 펼침은 #15,
      파라미터는 #16. 여기에 그것들을 미리 넣지 말 것 — 각 단위가 자기 화면으로
      판정되는데, 버튼이 늘수록 무엇 때문에 실패했는지가 흐려진다.
    -->
    <!--
      ★ 화면 글자는 `data-i18n` 키로 채운다 (I-1). 여기 있는 한국어는 **키가
        없을 때의 마지막 방어**이자 사람이 읽을 원본이고, 실제로 화면에 서는
        글자는 `src/panels/i18n.ts` 의 사전에서 온다 — `ui/langSwitch.ts` 의
        `applyStaticText()` 가 기동 때와 언어를 바꿀 때마다 다시 채운다.
        `data-i18n-title` 은 `title` 툴팁이다.
      ⚠️ 여기에 글자를 새로 넣을 때는 **키를 같이 달 것.** 안 달면 그 자리만
         한국어로 남고, 화면을 눈으로 훑기 전까지 아무도 모른다.
    -->
    <!--
      ── 1층: 메뉴바 (L-4) ───────────────────────────────────────
      데스크톱 앱의 맨 윗줄을 옮긴 것이다. 왼쪽이 메뉴, 가운데가 지금 열려
      있는 문서, 오른쪽이 화면 전체에 걸리는 조작(언어 · 설정 칸 여닫기)이다.

      ★ **씬 조작이 [파일] 안으로 들어왔다.** 예전에는 씬 목록 · 로드 ·
        파일 선택 · 업로드 · 씬 내림 다섯이 상단 바에 한 줄로 늘어서서 자리의
        절반을 먹었다. 씬을 여는 일은 **한 세션에 한두 번**이라 메뉴가 맞는
        자리이고, 그 자리를 비워야 툴바가 뷰포트별로 갈릴 수 있다.

      ⚠️ 그래서 `src/verify/ui.ts` 는 `#scene`·`#load`·`#file` 을 만지기 전에
         메뉴를 먼저 연다(`openFileMenu`). **닫힌 메뉴 안의 버튼은 Playwright 가
         못 누른다** — 여기 구조를 바꾸면 그쪽도 같이 봐야 한다.
      ⚠️ `#docTitle` 에는 `data-i18n` 을 **걸지 않는다.** 언어를 바꿀 때
         `applyStaticText()` 가 `textContent` 를 통째로 덮어써서 씬 이름이
         지워진다. 씬이 없을 때의 "제목 없음" 까지 `main.ts` 가 채운다.
    -->
    <div class="menubar" id="menubar">
      <div class="mgroup">
        <!--
          ⛔ **앱 마크를 두지 않는다.** 데스크톱 창은 왼쪽 위 아이콘이 있어야 어느
             프로그램인지 알 수 있지만, 브라우저는 탭의 파비콘과 제목이 이미 그
             일을 한다. 글자 한 자로 만든 자리표시는 로고를 아직 안 넣은 것으로
             읽힌다 — 위 메뉴 주석과 같은 규칙이다(소스가 외부로 나간다).
             진짜 로고 자산이 생기면 그때 여기에 넣는다.
        -->
        <!--
          ⚠️ 메뉴 이름은 `<button>` 이라야 한다. `<div>` 에 클릭만 달면 키보드로
             닿지 않는다 — Tab 으로 씬을 열 수 있어야 한다.
        -->
        <div class="menuroot" id="menuFileRoot">

          들고 있어서, 적용하면 위 두 탭에서 만진 체형·옷 사이즈가 저장 당시

        <div id="drapingPanel" class="pgroup"></div>
      </div>
    </div>

    <!--
      파라미터 패널 (#16). 위젯 22개의 **스키마·검증·비활성 판정은
      `src/panels/params.ts`** 에 있고(DOM 없음, Node 테스트 109건이 그 위에
      선다), 그리는 것만 `src/ui/paramsPanel.ts` 가 한다. 그래서 여기 있는 것은
      빈 자리 두 개뿐이다 — 행 22개는 스키마에서 나온다.

      ⚠️ 비활성 필드는 **회색만 되지 않는다.** 사유(엔진 미지원 / 시뮬 초기화 /
         종속 미충족)가 `.pwhy` 로 화면에 글자로 남는다. 툴팁에만 넣으면
         마우스를 올려야 보이는데, 그건 "보인다" 가 아니다.

      ⚠️ L-1 은 이 상자를 **건드리지 않았다** — 마크업도 CSS 도 그대로이고,
         소스에서의 자리만 칸 세 개 뒤로 옮겼다(`position: fixed` 라 격자
         아이템이 아니므로 배치에 영향이 없다). 오른쪽 칸으로의 이관은 L-3 이다.
    -->
    <!--
      ⚠️ `data-i18n` 을 `<summary>` 에 직접 걸지 않는다 (I-1) — 그 자리는
         `textContent` 대입이라 안쪽의 `#paramsBadge` 가 통째로 지워진다.
         글자만 감싼 `<span>` 에 건다.
    -->
    <details id="paramsWrap">
      <summary><span data-i18n="params.summary">⚙ 파라미터</span> <span id="paramsBadge"></span></summary>
      <div id="params"></div>
    </details>

    <!--
      ── 4층: 상태 바 (L-4) ──────────────────────────────────────
      예전에는 이 다섯이 상단 바 오른쪽 끝에 몰려 있었다. 데스크톱처럼 화면 맨
      아래로 내리면, 길이가 오가는 글자들이 위쪽 조작을 밀어내지 않는다.

      `#sim` 은 **워커가 말하는 상태**(재생/정지 · 프레임)이고 `#frames` 는
      **브라우저가 실제로 그린 것**(적용/버림/fps)이다. 출처가 다르므로 둘 다
      둔다 — 갈라지면 그 자체가 진단이다(프레임은 오는데 안 그려지는 상태).

      ⚠️ 가운데 [디자인 모드] 는 데스크톱의 "Design mode" 자리다. 지금은 모드가
         하나뿐이라 글자가 고정이다 — 모드가 늘면 여기가 바뀐다.
    -->
    <div class="statusbar" id="statusbar">
      <span id="status" data-i18n="bar.status.booting">시작하는 중…</span>
      <span class="spacer"></span>
      <span class="modelabel" data-i18n="statusbar.mode">디자인 모드</span>
      <span class="spacer"></span>
      <span id="sim" class="stat">-</span>
      <span id="frames" class="stat">-</span>
      <span id="stat" class="stat">-</span>
      <details id="logWrap">
        <summary data-i18n="log.summary">로그</summary>
        <div id="log"></div>
      </details>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
